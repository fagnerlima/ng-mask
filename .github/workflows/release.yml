name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Verify, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check that the tag is on master
          persist-credentials: false

      - name: Verify the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Release from master only."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (vX.Y.Z[-pre])."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CHANGELOG.md has a section for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-section.mjs "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test && npm run test:scripts

      - name: Build library
        run: npm run build:lib

      - name: Set package version from tag
        working-directory: dist/ng-mask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Check packed package has no runtime dependencies
        run: npm run pack:check

      - name: Pack
        working-directory: dist/ng-mask
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Only this job can mint the OIDC token, and it runs no dependency code: it publishes the
  # tarball built above.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewers and the v*.*.* tag rule of this environment gate the publish; the npm
    # Trusted Publisher is bound to it.
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Node 24 bundles a recent npm; fail instead of installing an unpinned one in this job.
      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          version="$(npm --version)"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$version"; then
            echo "::error::npm $version cannot use Trusted Publishing; 11.5.1 or later is required."
            exit 1
          fi
          echo "npm $version"

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --provenance --access public --tag "$DIST_TAG"

  github-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node scripts/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            "${prerelease[@]}"
